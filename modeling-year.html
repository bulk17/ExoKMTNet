<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modeling — KMTNet Exoplanet Archive</title>
<meta name="description" content="KMTNet modeler upload and file list for a single year." />
<link rel="stylesheet" href="assets/css/style.css?v=20261011j" />
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-title">
        <div class="brand-icons">
          <a href="https://www.kasi.re.kr/" target="_blank" rel="noopener">
            <img src="assets/images/kasi-logo.png" alt="KASI" class="brand-emblem" />
          </a>
          <a href="https://kmtnet.kasi.re.kr/kmtnet/" target="_blank" rel="noopener">
            <img src="assets/images/kmtnet-emblem.png" alt="KMTNet emblem" class="brand-emblem" />
          </a>
        </div>
        <a href="index.html"><span>KMTNet Exoplanet Archive</span></a>
      </div>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="stats.html">Statistics</a>
      <a href="index.html#about">About</a>
      <a href="modeling.html">Modeling</a>
      <button class="theme-toggle" id="themeToggle" type="button">🌓 Theme</button>
    </nav>
  </div>

  <section class="hero">
    <div class="hero-top">
      <div class="hero-copy">
        <h1 id="yearTitle">Modeling</h1>
        <p><a href="modeling.html">← Back to years</a></p>
      </div>
      <div class="hero-mascot-wrap">
        <div class="mascot-bubble">Add a<br />file!</div>
        <img src="assets/images/kensy-mascot.svg" alt="Kensy, the KMTNet mascot" class="hero-mascot" />
      </div>
    </div>
  </section>

  <section id="modeling-upload">
    <div class="about">
      <h3>Upload</h3>
      <form class="upload-form" id="uploadForm">
        <input type="file" id="uploadFileInput" required />
        <button type="submit" class="btn">Upload</button>
      </form>
      <p class="upload-status" id="uploadStatus" hidden></p>
    </div>

    <div class="about" id="fileListCard">
      <h3>Uploaded files</h3>
      <div id="fileList"></div>
    </div>
  </section>

  <footer><span>KMTNet Exoplanet Archive</span><span>Copyright &copy; Korea Astronomy and Space Science Institute. All Rights Reserved.</span></footer>
</div>

<div class="overlay" id="previewOverlay"></div>
<div class="modal modal-image" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewModalTitle">
  <button class="close" id="previewModalClose" aria-label="Close">✕</button>
  <h2 id="previewModalTitle"></h2>
  <img id="previewModalImg" alt="" />
</div>

<button type="button" class="mascot-fab" id="mascotFab" aria-label="Back to top">
  <img src="assets/images/kensy-mascot.svg" alt="" />
</button>

<script>
(function () {
  var minYear = 2016, maxYear = 2026;
  var params = new URLSearchParams(window.location.search);
  var year = parseInt(params.get("year"), 10);
  if (!year || year < minYear || year > maxYear) year = new Date().getFullYear();

  document.getElementById("yearTitle").textContent = "Modeling — " + year;
  document.title = "Modeling " + year + " — KMTNet Exoplanet Archive";

  // This page is a client-side preview: uploaded files are remembered only
  // in this browser's localStorage (name/note, and — for small images
  // only — the image data itself, so it can be previewed), not sent
  // anywhere. Once the modeling server is deployed, the year links on
  // modeling.html point there instead of here — see that file's
  // MODELING_BASE_URL comment, and modeling-server/README.md in the
  // private bulk17/ExoKMTNet-modeling repo for the real upload/listing.
  var STORAGE_KEY = "kmtnet-modeling-files-" + year;
  var MAX_PREVIEW_BYTES = 2 * 1024 * 1024; // images over this size aren't stored, just listed

  var form = document.getElementById("uploadForm");
  var fileInput = document.getElementById("uploadFileInput");
  var status = document.getElementById("uploadStatus");
  var fileList = document.getElementById("fileList");
  var previewOverlay = document.getElementById("previewOverlay");
  var previewModal = document.getElementById("previewModal");
  var previewModalClose = document.getElementById("previewModalClose");
  var previewModalTitle = document.getElementById("previewModalTitle");
  var previewModalImg = document.getElementById("previewModalImg");

  function loadFiles() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveFiles(files) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
      return true;
    } catch (e) {
      return false;
    }
  }

  function openPreview(name, dataUrl) {
    previewModalTitle.textContent = name;
    previewModalImg.src = dataUrl;
    previewModalImg.alt = name;
    previewOverlay.classList.add("open");
    previewModal.classList.add("open");
  }
  function closePreview() {
    previewOverlay.classList.remove("open");
    previewModal.classList.remove("open");
    previewModalImg.src = "";
  }
  previewOverlay.addEventListener("click", closePreview);
  previewModalClose.addEventListener("click", closePreview);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePreview();
  });

  function renderFiles() {
    var files = loadFiles();
    fileList.innerHTML = "";
    if (!files.length) {
      var empty = document.createElement("p");
      empty.className = "upload-status";
      empty.style.marginTop = "0";
      empty.textContent = "No files uploaded yet.";
      fileList.appendChild(empty);
      return;
    }
    var table = document.createElement("table");
    table.className = "file-table";
    var thead = document.createElement("thead");
    thead.innerHTML = "<tr><th>File</th><th>Note</th><th></th></tr>";
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    files.forEach(function (f, i) {
      var tr = document.createElement("tr");
      var tdName = document.createElement("td");
      if (f.dataUrl) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "file-name-btn";
        btn.textContent = f.name;
        btn.addEventListener("click", function () { openPreview(f.name, f.dataUrl); });
        tdName.appendChild(btn);
      } else {
        tdName.textContent = f.name;
      }
      var tdNote = document.createElement("td");
      var noteInput = document.createElement("input");
      noteInput.type = "text";
      noteInput.className = "file-note-input";
      noteInput.placeholder = "Add a note…";
      noteInput.value = f.note || "";
      noteInput.addEventListener("change", function () { updateNote(i, noteInput.value); });
      tdNote.appendChild(noteInput);
      var tdRemove = document.createElement("td");
      var removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "file-remove-btn";
      removeBtn.setAttribute("aria-label", "Remove " + f.name);
      removeBtn.textContent = "✕";
      removeBtn.addEventListener("click", function () { removeFile(i); });
      tdRemove.appendChild(removeBtn);
      tr.appendChild(tdName);
      tr.appendChild(tdNote);
      tr.appendChild(tdRemove);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    var scroll = document.createElement("div");
    scroll.className = "table-scroll";
    scroll.appendChild(table);
    fileList.appendChild(scroll);
  }

  function removeFile(index) {
    var files = loadFiles();
    files.splice(index, 1);
    saveFiles(files);
    renderFiles();
  }

  function updateNote(index, note) {
    var files = loadFiles();
    if (!files[index]) return;
    files[index].note = note;
    saveFiles(files);
  }

  function addFile(file, dataUrl) {
    var files = loadFiles();
    files.unshift({ name: file.name, note: "", dataUrl: dataUrl || null });
    var saved = saveFiles(files);
    if (!saved && dataUrl) {
      // Likely over localStorage's quota with the image data included — drop
      // the image and keep just the metadata so the upload still "succeeds".
      files[0].dataUrl = null;
      saved = saveFiles(files);
      return saved ? "no-preview-quota" : "failed";
    }
    return saved ? "ok" : "failed";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!fileInput.files.length) {
      status.hidden = false;
      status.textContent = "Choose a file first.";
      return;
    }
    var file = fileInput.files[0];
    var isImage = file.type.indexOf("image/") === 0;

    function finish(result) {
      renderFiles();
      form.reset();
      status.hidden = false;
      if (result === "failed") {
        status.textContent = "Couldn't save \"" + file.name + "\" — this browser's local storage is full. Try clearing some old preview uploads.";
        return;
      }
      var note = "Preview only — \"" + file.name + "\" is remembered just in this browser, not uploaded to a real server yet.";
      if (isImage && result === "no-preview-quota") {
        note += " Too large to keep an image preview for, so only the name is listed.";
      } else if (!isImage) {
        note += " Not an image, so no preview is shown — just the filename.";
      }
      status.textContent = note;
    }

    if (isImage && file.size <= MAX_PREVIEW_BYTES) {
      var reader = new FileReader();
      reader.onload = function () { finish(addFile(file, reader.result)); };
      reader.onerror = function () { finish(addFile(file, null)); };
      reader.readAsDataURL(file);
    } else {
      finish(addFile(file, null));
    }
  });

  renderFiles();
})();
</script>
<script>
(function () {
  var themeToggle = document.getElementById("themeToggle");
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
  }
  try {
    var savedTheme = localStorage.getItem("kmtnet-theme");
    if (savedTheme) applyTheme(savedTheme);
  } catch (e) {}
  if (themeToggle) {
    themeToggle.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var next;
      if (!cur) {
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        next = prefersDark ? "light" : "dark";
      } else {
        next = cur === "dark" ? "light" : "dark";
      }
      applyTheme(next);
      try { localStorage.setItem("kmtnet-theme", next); } catch (e) {}
    });
  }
})();
</script>
<script>
(function () {
  var fab = document.getElementById("mascotFab");
  if (!fab) return;

  var mouseX = null, mouseY = null;
  window.addEventListener("mousemove", function (e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  }, { passive: true });

  function positionNearCursor() {
    var w = fab.offsetWidth || 56, h = fab.offsetHeight || 56;
    var vw = window.innerWidth, vh = window.innerHeight;
    var x, y;
    if (mouseX == null) {
      x = vw - w - 20;
      y = vh - h - 20;
    } else {
      x = mouseX + 18;
      y = mouseY + 18;
      if (x + w > vw - 8) x = mouseX - w - 18;
      if (y + h > vh - 8) y = mouseY - h - 18;
      x = Math.max(8, Math.min(x, vw - w - 8));
      y = Math.max(8, Math.min(y, vh - h - 8));
    }
    fab.style.left = x + "px";
    fab.style.top = y + "px";
  }

  var wasShown = false;
  function onScroll() {
    var shown = window.scrollY > 400;
    if (shown && !wasShown) positionNearCursor();
    fab.classList.toggle("show", shown);
    wasShown = shown;
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  fab.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "instant" });
  });
})();
</script>
</body>
</html>
