<svg width="480" height="560" viewBox="0 0 480 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc0f5"/>
      <stop offset="100%" stop-color="#1d6fbf"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f0a24e"/>
      <stop offset="100%" stop-color="#c9670c"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="240" cy="522" rx="112" ry="14" fill="#14161f" opacity="0.12"/>

  <!-- pedestal (the 3-site global network) -->
  <ellipse cx="240" cy="500" rx="100" ry="28" fill="#14161f"/>
  <ellipse cx="240" cy="492" rx="90" ry="19" fill="#2a4a6b" opacity="0.55"/>
  <path d="M155,497 Q240,516 325,497" stroke="#c9670c" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" fill="none" opacity="0.85"/>
  <circle cx="168" cy="499" r="6" fill="#c9670c"/>
  <circle cx="240" cy="509" r="6" fill="#c9670c"/>
  <circle cx="312" cy="499" r="6" fill="#c9670c"/>

  <!-- feet -->
  <ellipse cx="204" cy="472" rx="24" ry="15" fill="#175a99"/>
  <ellipse cx="276" cy="472" rx="24" ry="15" fill="#175a99"/>

  <!-- arms -->
  <path d="M144,338 Q90,302 96,238" stroke="url(#bodyGrad)" stroke-width="27" stroke-linecap="round" fill="none"/>
  <circle cx="97" cy="232" r="17" fill="#1d6fbf"/>
  <ellipse cx="97" cy="196" rx="27" ry="8" fill="none" stroke="#c9670c" stroke-width="3" transform="rotate(-18 97 196)"/>
  <circle cx="97" cy="198" r="15" fill="url(#irisGrad)"/>
  <circle cx="91" cy="193" r="4" fill="#fbe6cf"/>

  <path d="M336,338 Q392,316 382,262" stroke="url(#bodyGrad)" stroke-width="27" stroke-linecap="round" fill="none"/>
  <circle cx="383" cy="257" r="17" fill="#1d6fbf"/>

  <!-- body / dome -->
  <ellipse cx="240" cy="350" rx="122" ry="132" fill="url(#bodyGrad)"/>
  <path d="M120,402 Q240,434 360,402 L360,418 Q240,450 120,418 Z" fill="#175a99"/>

  <!-- antenna -->
  <line x1="240" y1="205" x2="240" y2="160" stroke="#14161f" stroke-width="6" stroke-linecap="round"/>
  <polygon points="240,138 247,153 263,153 250,163 255,179 240,169 225,179 230,163 217,153 233,153"
           fill="#c9670c"/>

  <!-- face plate -->
  <circle cx="240" cy="330" r="97" fill="#f6f1e6"/>

  <!-- cheeks -->
  <ellipse cx="153" cy="368" rx="15" ry="9" fill="#fbe6cf"/>
  <ellipse cx="327" cy="368" rx="15" ry="9" fill="#fbe6cf"/>

  <!-- big lens eye -->
  <circle cx="240" cy="326" r="72" fill="#14161f"/>
  <circle cx="240" cy="326" r="61" fill="#ffffff"/>
  <circle cx="240" cy="326" r="43" fill="url(#irisGrad)"/>

  <!-- microlensing flash - three sparkles, one for each KMTNet telescope -->
  <polygon points="230,300.2 232.9,309.1 241.8,312 232.9,314.9 230,323.8 227.1,314.9 218.2,312 227.1,309.1" fill="#ffffff"/>
  <polygon points="252,294.2 254.9,303.1 263.8,306 254.9,308.9 252,317.8 249.1,308.9 240.2,306 249.1,303.1" fill="#ffffff"/>
  <polygon points="234,326.2 236.9,335.1 245.8,338 236.9,340.9 234,349.8 231.1,340.9 222.2,338 231.1,335.1" fill="#ffffff"/>
  <circle cx="230" cy="312" r="1" fill="#ffffff"/>
  <circle cx="252" cy="306" r="1" fill="#ffffff"/>
  <circle cx="234" cy="338" r="1" fill="#ffffff"/>

  <!-- eye catchlight -->
  <circle cx="220" cy="304" r="9" fill="#ffffff" opacity="0.9"/>
</svg>
